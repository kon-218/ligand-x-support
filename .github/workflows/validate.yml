name: Validate support repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate YAML and issue-form contracts
        shell: ruby {0}
        run: |
          require "yaml"

          forms = Dir[".github/ISSUE_TEMPLATE/*.yml"].reject { |path| path.end_with?("/config.yml") }.sort
          abort "expected eight issue forms" unless forms.length == 8

          label_definitions = YAML.safe_load_file(".github/labels.yml", aliases: false)
          labels = label_definitions.map { |entry| entry.fetch("name") }
          abort "duplicate label definitions" unless labels.uniq.length == labels.length

          forms.each do |path|
            form = YAML.safe_load_file(path, aliases: false)
            %w[name description title labels body].each { |key| form.fetch(key) }
            abort "#{path}: empty form body" if form.fetch("body").empty?
            unknown = form.fetch("labels") - labels
            abort "#{path}: undefined labels: #{unknown.join(', ')}" unless unknown.empty?
            ids = form.fetch("body").filter_map { |item| item["id"] }
            abort "#{path}: duplicate field ids" unless ids.uniq.length == ids.length
          end

          # These IDs and exact dropdown values are the public URL-prefill
          # contract used by the Ligand-X application. Renaming one requires a
          # coordinated application change.
          app_contract = {
            "02-core.yml" => {
              "ids" => %w[component version launcher-version environment actual job-id],
              "field" => "component",
              "options" => ["Docking", "Molecular Dynamics", "MSA", "Workflow orchestration"],
            },
            "03-pro.yml" => {
              "ids" => %w[module version launcher-version environment actual job-id],
              "field" => "module",
              "options" => ["ADMET", "Boltz2", "Quantum Chemistry", "ABFE", "RBFE", "REINVENT", "Kinetics", "QM/MM"],
            },
          }
          app_contract.each do |filename, contract|
            form = YAML.safe_load_file(".github/ISSUE_TEMPLATE/#{filename}", aliases: false)
            fields = form.fetch("body").filter_map { |item| item["id"] ? [item["id"], item] : nil }.to_h
            missing = contract.fetch("ids") - fields.keys
            abort "#{filename}: missing app-prefill fields: #{missing.join(', ')}" unless missing.empty?
            options = fields.fetch(contract.fetch("field")).fetch("attributes").fetch("options")
            missing_options = contract.fetch("options") - options
            abort "#{filename}: missing app-prefill options: #{missing_options.join(', ')}" unless missing_options.empty?
          end

          launcher = YAML.safe_load_file(".github/ISSUE_TEMPLATE/01-launcher.yml", aliases: false)
          launcher_ids = launcher.fetch("body").filter_map { |item| item["id"] }
          required_launcher_ids = %w[launcher-version product-version os-version actual]
          missing_launcher_ids = required_launcher_ids - launcher_ids
          abort "01-launcher.yml: missing launcher-prefill fields: #{missing_launcher_ids.join(', ')}" unless missing_launcher_ids.empty?

          config = YAML.safe_load_file(".github/ISSUE_TEMPLATE/config.yml", aliases: false)
          abort "blank issues must remain disabled" unless config["blank_issues_enabled"] == false
      - name: Check required policy files and links
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md SUPPORT.md SECURITY.md PRIVACY.md CONTRIBUTING.md TRIAGE.md CODE_OF_CONDUCT.md; do
            test -s "$file"
          done
          if rg -n 'github\.com/kon-218/(ligand-x|ligand-x-pro)/(issues|discussions)' --glob '*.md' --glob '*.yml'; then
            echo "Public support content must not route users to private repositories." >&2
            exit 1
          fi
